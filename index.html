<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loja Vue.js - Trabalho Escola do Futuro</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="app">

        <header>
            <h1>Loja Vue.js</h1>
            <p>Aplicação demonstrativa com componentes reativos</p>

            <button
                class="carrinho"
                @click="abrirCarrinho"
            >
                Itens no carrinho: {{ quantidadeCarrinho }}
            </button>
        </header>

        <main>

            <section class="busca">
                <label for="pesquisa">Buscar produto:</label>

                <input
                    id="pesquisa"
                    type="text"
                    v-model="termoBusca"
                    placeholder="Digite o nome do produto"
                >
            </section>

            <section class="produtos">

                <product-card
                    v-for="produto in produtosFiltrados"
                    :key="produto.id"
                    :id="produto.id"
                    :nome="produto.nome"
                    :preco="produto.preco"
                    :imagem="produto.imagem"
                    @adicionar="adicionarAoCarrinho"
                >
                </product-card>

            </section>

            <p
                class="sem-resultados"
                v-if="produtosFiltrados.length === 0"
            >
                Nenhum produto encontrado.
            </p>

        </main>


        <!-- JANELA DO CARRINHO -->

        <div
            class="carrinho-fundo"
            v-if="carrinhoAberto"
            @click.self="fecharCarrinho"
        >

            <section class="carrinho-janela">

                <h2>Meu Carrinho</h2>

                <p
                    class="carrinho-vazio"
                    v-if="carrinho.length === 0"
                >
                    Seu carrinho está vazio.
                </p>

                <div
                    class="item-carrinho"
                    v-for="item in carrinho"
                    :key="item.id"
                >

                    <img
                        :src="item.imagem"
                        :alt="item.nome"
                    >

                    <div class="item-info">

                        <h3>{{ item.nome }}</h3>

                        <p>
                            {{ formatarPreco(item.preco) }}
                        </p>

                        <p>
                            Quantidade: {{ item.quantidade }}
                        </p>

                    </div>

                    <button
                        class="remover-item"
                        @click="removerDoCarrinho(item)"
                    >
                        Remover
                    </button>

                </div>


                <div
                    class="carrinho-total"
                    v-if="carrinho.length > 0"
                >
                    Total:
                    {{ formatarPreco(totalCarrinho) }}
                </div>


                <div class="acoes-carrinho">

                    <button
                        class="limpar"
                        v-if="carrinho.length > 0"
                        @click="limparCarrinho"
                    >
                        Limpar Carrinho
                    </button>

                    <button
                        class="fechar"
                        @click="fecharCarrinho"
                    >
                        Fechar
                    </button>

                </div>

            </section>

        </div>

    </div>


    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
